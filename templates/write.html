{% extends "base.html" %}
{% block title %}Jonte's Guestbook - Send your Message!{% endblock %}
{% block content %}
<div>
    <h2>
        Please send your message down below!
    </h2>
    <form method="POST" action="/send">
        Name: <input name="Name" placeholder="Enter your name" type="text"><br>
        Email: <input name="Email" placeholder="Enter your Email" type="text"><br>
        Tel: <input name="Telephone" type="number"><br>
        Message: <br> 
        <textarea name="Message"></textarea><br>
        <input type="submit">
    </form>
</div>
{% endblock %}
